services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: synkroo-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-synkroo}
      POSTGRES_USER: ${POSTGRES_USER:-synkroo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-dev-password}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-synkroo} -d ${POSTGRES_DB:-synkroo}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
