name: Gitleaks Full History Scan (Scheduled)

# Fase 0: revalidação semanal do histórico completo.
# Complementa o job gitleaks do ci.yml (que escaneia push/PR).
# Se um commit antigo com segredo for descoberto após merge,
# este scan o flagará — o ci.yml só vê novos commits.

on:
  schedule:
    - cron: '0 6 * * 1'  # toda segunda-feira 06:00 UTC
  workflow_dispatch:      # execução manual

jobs:
  gitleaks-full:
    name: Full History Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        # actions/checkout v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # O1-G01: scheduled full-history scan remains redacted and blocking.
      # Scanner binary version pinned via GITLEAKS_VERSION (sem prefixo `v`).
      # A action cobre o trigger `schedule` com o mesmo step do ci.yml
      # (ver README da gitleaks-action v2.3.9: matriz push/PR/schedule).
      - name: Run Gitleaks (full history)
        # gitleaks/gitleaks-action v2.3.9
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.24.0
