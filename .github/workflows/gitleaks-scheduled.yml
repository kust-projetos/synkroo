name: Gitleaks Full History Scan (Scheduled)

# Fase 0: revalidação semanal do histórico completo.
# Complementa o job gitleaks do ci.yml (que escaneia push/PR).
# Se um commit antigo com segredo for descoberto após merge,
# este scan o flagará — o ci.yml só vê novos commits.

on:
  schedule:
    - cron: '0 6 * * 1'  # toda segunda-feira 06:00 UTC
  workflow_dispatch:      # execução manual

jobs:
  gitleaks-full:
    name: Full History Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        # actions/checkout v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # O1-G01: scheduled full-history scan remains redacted and blocking.
      # Binário OSS direto: a wrapper gitleaks-action v2 exige licença paga em
      # organizações (falha "missing gitleaks license"). Versão + sha256 fixados.
      - name: Install Gitleaks (pinned 8.24.0, checksum-verified)
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz"
          echo "cb49b7de5ee986510fe8666ca0273a6cc15eb82571f2f14832c9e8920751f3a4  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Run Gitleaks (full history)
        run: gitleaks detect --source . --log-opts="--all" --redact
