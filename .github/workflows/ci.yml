name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Build
        run: npx next build
        env:
          DATABASE_URL: postgresql://synkroo:test@localhost:5432/synkroo
          AUTH_SECRET: fake-auth-secret-for-ci-at-least-32-chars
          JWT_SECRET: fake-jwt-secret-for-ci
          MINIMAX_API_KEY: [REDACTED]
          SEED_SECRET: [REDACTED]