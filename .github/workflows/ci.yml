name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]

jobs:
  # Full-history secret scan is always blocking.
  gitleaks:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks (tree + full history)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz | tar xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --log-opts="--all" --verbose --redact

  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: gitleaks
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: synkroo
          POSTGRES_PASSWORD: test
          POSTGRES_DB: synkroo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synkroo -d synkroo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test -- --runInBand
      - name: Enable pgvector
        run: psql -h 127.0.0.1 -p 5432 -U synkroo -d synkroo_test -c "CREATE EXTENSION IF NOT EXISTS vector;"
        env:
          PGPASSWORD: test
      - name: Integration tests
        run: npm run test:integration:run
        env:
          TEST_DATABASE_URL: postgresql://synkroo:test@127.0.0.1:5432/synkroo_test
      - name: Security tests
        run: npm run test:security -- --runInBand
      - name: Release contract tests
        run: npm run test:release
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Setup synkroo database for build
        run: |
          psql -h 127.0.0.1 -p 5432 -U synkroo -d postgres -c "CREATE DATABASE \"synkroo\""
          psql -h 127.0.0.1 -p 5432 -U synkroo -d synkroo -c "CREATE EXTENSION IF NOT EXISTS vector"
        env:
          PGPASSWORD: test
      - name: Migrate synkroo database
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://synkroo:test@127.0.0.1:5432/synkroo
      - name: Seed synkroo database
        run: node scripts/seed-test-clinic.mjs
        env:
          DATABASE_URL: postgresql://synkroo:test@127.0.0.1:5432/synkroo
      - name: Build (Next.js)
        run: npm run build
        env:
          DATABASE_URL: postgresql://synkroo:test@localhost:5432/synkroo
          AUTH_SECRET: fake-auth-secret-for-ci-at-least-32-chars
          JWT_SECRET: fake-jwt-secret-for-ci
          MINIMAX_API_KEY: CI_PLACEHOLDER
          SEED_SECRET: CI_PLACEHOLDER
      - name: Production E2E (no retries)
        run: npm run test:e2e:production
        env:
          CI: true
          DATABASE_URL: postgresql://synkroo:test@127.0.0.1:5432/synkroo
          AUTH_SECRET: fake-auth-secret-for-ci-at-least-32-chars
          JWT_SECRET: fake-jwt-secret-for-ci
          MINIMAX_API_KEY: CI_PLACEHOLDER
          SEED_SECRET: CI_PLACEHOLDER

  cf-build:
    name: CF Build & Dry Run
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: OpenNext build
        run: npm run build:cf
        env:
          DATABASE_URL: postgresql://synkroo:test@localhost:5432/synkroo
          AUTH_SECRET: fake-auth-secret-for-ci-at-least-32-chars
          JWT_SECRET: fake-jwt-secret-for-ci
          MINIMAX_API_KEY: CI_PLACEHOLDER
          SEED_SECRET: CI_PLACEHOLDER
      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run --config wrangler.toml
