name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Full-history secret scan is always blocking.
  gitleaks:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        # actions/checkout v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # O1-G01: blocking scan covers tree and full history; output is always redacted.
      # Binário OSS direto: a wrapper gitleaks-action v2 exige licença paga em
      # organizações (falha "missing gitleaks license"). Versão + sha256 fixados.
      - name: Install Gitleaks (pinned 8.24.0, checksum-verified)
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz"
          echo "cb49b7de5ee986510fe8666ca0273a6cc15eb82571f2f14832c9e8920751f3a4  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Run Gitleaks (tree + full history)
        run: gitleaks detect --source . --log-opts="--all" --redact

  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: gitleaks
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: synkroo
          POSTGRES_PASSWORD: test
          POSTGRES_DB: synkroo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synkroo -d synkroo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run typecheck:ia-bridge
      - run: npm run typecheck:ia-agent
      - run: npm test -- --runInBand --coverage
      - name: Enable pgvector + btree_gist
        run: |
          psql -h 127.0.0.1 -p 5432 -U synkroo -d synkroo_test -c "CREATE EXTENSION IF NOT EXISTS vector;"
          psql -h 127.0.0.1 -p 5432 -U synkroo -d synkroo_test -c "CREATE EXTENSION IF NOT EXISTS btree_gist;"
        env:
          PGPASSWORD: test
      - name: Integration tests
        run: npm run test:integration:run
        env:
          TEST_DATABASE_URL: postgresql://synkroo:test@127.0.0.1:5432/synkroo_test
      - name: Security tests
        run: npm run test:security -- --runInBand
      - name: Release contract tests
        run: npm run test:release
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Setup synkroo database for build
        run: |
          psql -h 127.0.0.1 -p 5432 -U synkroo -d postgres -c "CREATE DATABASE \"synkroo\""
          psql -h 127.0.0.1 -p 5432 -U synkroo -d synkroo -c "CREATE EXTENSION IF NOT EXISTS vector"
          psql -h 127.0.0.1 -p 5432 -U synkroo -d synkroo -c "CREATE EXTENSION IF NOT EXISTS btree_gist"
        env:
          PGPASSWORD: test
      - name: Migrate synkroo database
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://synkroo:test@127.0.0.1:5432/synkroo
      - name: Seed synkroo database
        run: node scripts/seed-test-clinic.mjs
        env:
          DATABASE_URL: postgresql://synkroo:test@127.0.0.1:5432/synkroo
      - name: Build (Next.js)
        run: npm run build
        env:
          DATABASE_URL: postgresql://synkroo:test@localhost:5432/synkroo
          AUTH_SECRET: fake-auth-secret-for-ci-at-least-32-chars
          JWT_SECRET: fake-jwt-secret-for-ci
          MINIMAX_API_KEY: CI_PLACEHOLDER
          SEED_SECRET: CI_PLACEHOLDER
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      # Production-mode E2E: build de producao (next build + next start local na
      # porta 3003) + Playwright — nao e smoke contra producao real.
      # Politica (F1 concluida 2026-09-14): BLOQUEANTE — verde no CI (runs
      # 34846166474 e seguinte) apos estabilidade comprovada.
      - name: Production-mode E2E
        run: npm run test:e2e:production
        env:
          CI: true
          DATABASE_URL: postgresql://synkroo:test@127.0.0.1:5432/synkroo
          AUTH_SECRET: fake-auth-secret-for-ci-at-least-32-chars
          JWT_SECRET: fake-jwt-secret-for-ci
          MINIMAX_API_KEY: CI_PLACEHOLDER
          SEED_SECRET: CI_PLACEHOLDER

  # Etapa 8: prova que a cadeia de migrations aplica limpa a partir do zero
  # e que reaplicar e idempotente. Job barato (sobe Postgres proprio,
  # sem seed, sem build) e bloqueante via needs: gitleaks.
  migrations-from-zero:
    name: Migrations From Zero
    runs-on: ubuntu-latest
    needs: gitleaks
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: synkroo
          POSTGRES_PASSWORD: test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synkroo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Create empty database
        run: psql -h 127.0.0.1 -p 5432 -U synkroo -d postgres -c "CREATE DATABASE \"synkroo_zero\""
        env:
          PGPASSWORD: test
      - name: Enable pgvector + btree_gist
        run: |
          psql -h 127.0.0.1 -p 5432 -U synkroo -d synkroo_zero -c "CREATE EXTENSION IF NOT EXISTS vector;"
          psql -h 127.0.0.1 -p 5432 -U synkroo -d synkroo_zero -c "CREATE EXTENSION IF NOT EXISTS btree_gist;"
        env:
          PGPASSWORD: test
      - name: Migrate empty database (first run, must pass on empty)
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://synkroo:test@127.0.0.1:5432/synkroo_zero
      - name: Migrate again (idempotency check, must exit 0 as no-op)
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://synkroo:test@127.0.0.1:5432/synkroo_zero
      - name: Smoke assertion — key tables exist
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5432 -U synkroo -d synkroo_zero -c "SELECT 1 FROM clinics LIMIT 1;"
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5432 -U synkroo -d synkroo_zero -c "SELECT 1 FROM patients LIMIT 1;"
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5432 -U synkroo -d synkroo_zero -c "SELECT 1 FROM appointments LIMIT 1;"
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5432 -U synkroo -d synkroo_zero -c "SELECT 1 FROM idempotency_keys LIMIT 1;"
        env:
          PGPASSWORD: test

  cf-build:
    name: CF Build & Dry Run
    runs-on: ubuntu-latest
    needs: ci
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: OpenNext build
        run: npm run build:cf
        env:
          DATABASE_URL: postgresql://synkroo:test@localhost:5432/synkroo
          AUTH_SECRET: fake-auth-secret-for-ci-at-least-32-chars
          JWT_SECRET: fake-jwt-secret-for-ci
          MINIMAX_API_KEY: CI_PLACEHOLDER
          SEED_SECRET: CI_PLACEHOLDER
      - name: Wrangler dry run (app + bridge + agent)
        run: |
          npx wrangler deploy --dry-run --config wrangler.toml
          npx wrangler deploy --dry-run --config wrangler.ia-bridge.jsonc
          npx wrangler deploy --dry-run --config src/workers/ia-agent/wrangler.jsonc
