name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

jobs:
  # ── Gitleaks secret scan (bloqueante) ──────────────────────────
  # Fase 0: scanner bloqueante sobre tree + history completo.
  # Usa CLI direta (não a action) para evitar GITLEAKS_LICENSE em org.
  # Falha = pipeline para. Suppressions somente fixtures/docs comprovados.
  gitleaks:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks (tree + full history)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz | tar xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --log-opts="--all" --verbose --redact

  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: gitleaks

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: synkroo
          POSTGRES_PASSWORD: test
          POSTGRES_DB: synkroo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synkroo -d synkroo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Enable pgvector
        run: psql -h 127.0.0.1 -p 5432 -U synkroo -d synkroo_test -c "CREATE EXTENSION IF NOT EXISTS vector;"
        env:
          PGPASSWORD: test

      - name: Integration tests
        run: npm run test:integration:run
        env:
          TEST_DATABASE_URL: postgresql://synkroo:test@127.0.0.1:5432/synkroo_test

      - name: Setup synkroo database for build
        run: |
          psql -h 127.0.0.1 -p 5432 -U synkroo -d postgres -c "CREATE DATABASE \"synkroo\""
          psql -h 127.0.0.1 -p 5432 -U synkroo -d synkroo -c "CREATE EXTENSION IF NOT EXISTS vector"
        env:
          PGPASSWORD: test

      - name: Migrate synkroo database
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://synkroo:test@127.0.0.1:5432/synkroo

      - name: Seed synkroo database
        run: node scripts/seed-test-clinic.mjs
        env:
          DATABASE_URL: postgresql://synkroo:test@127.0.0.1:5432/synkroo

      - name: Build (Next.js)
        run: npx next build
        env:
          DATABASE_URL: postgresql://synkroo:test@localhost:5432/synkroo
          AUTH_SECRET: fake-auth-secret-for-ci-at-least-32-chars
          JWT_SECRET: fake-jwt-secret-for-ci
          MINIMAX_API_KEY: CI_PLACEHOLDER
          SEED_SECRET: CI_PLACEHOLDER

  # ── Cloudflare Workers build (full pipeline) ──────────────────
  # Ativado manualmente via workflow_dispatch ou em branches de release.
  # Requer workaround: chromium-bidi/lib/cjs (ver docs/runbook-deploy-instancia.md)
  cf-build:
    name: CF Build (OpenNext + Wrangler)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/release/')
    needs: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: CF Build
        run: npm run build:cf
        env:
          DATABASE_URL: postgresql://synkroo:test@localhost:5432/synkroo
          AUTH_SECRET: fake-auth-secret-for-ci-at-least-32-chars
          JWT_SECRET: fake-jwt-secret-for-ci
          MINIMAX_API_KEY: CI_PLACEHOLDER
          SEED_SECRET: CI_PLACEHOLDER

      # TODO(W4.6): adicionar step de deploy após validação de conta Cloudflare
      # - name: Deploy
      #   run: npm run deploy:cf
      #   env:
      #     CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
