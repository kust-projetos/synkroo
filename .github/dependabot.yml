# Dependabot — Etapa 7 (CI/supply chain hardening).
# Sem auto-merge em nenhum ecossistema: todo update vira PR para review
# humano e passa pelo CI (gitleaks → ci → cf-build) antes do merge.
version: 2
updates:
  # Dependências npm na raiz. Minor + patch agrupados num PR semanal;
  # majors ficam desagrupados (um PR por major) para avaliação isolada
  # de breaking changes.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  # GitHub Actions (inclui os `uses:` com SHA deste repo — o bump de SHA
  # chega como PR agrupado semanal; ver docs/ops/ci-supply-chain.md).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
