services:
  remediation-postgres:
    image: pgvector/pgvector:pg17
    container_name: synkroo-remediation-db
    environment:
      POSTGRES_DB: synkroo_remediation
      POSTGRES_USER: synkroo_test
      POSTGRES_PASSWORD: local-remediation-only
    ports:
      - "55434:5432"
    volumes:
      - remediation_postgres_data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synkroo_test -d synkroo_remediation"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  remediation_postgres_data:
