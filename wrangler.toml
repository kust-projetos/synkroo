name = "synkroo"
main = "worker-entry.mjs"
compatibility_date = "2026-06-23"
compatibility_flags = ["nodejs_compat"]
triggers = { crons = ["*/5 * * * *"] }

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "IA_BRIDGE"
service = "synkroo-ia-bridge"
entrypoint = "AppService"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "synkroo"

[[durable_objects.bindings]]
name = "AGENT"
class_name = "AgentOrchestrator"
script_name = "synkroo-ia-agent"

[[durable_objects.bindings]]
name = "NEXT_CACHE_DO_QUEUE"
class_name = "DOQueueHandler"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DOQueueHandler"]

[[kv_namespaces]]
binding = "SYNKROO_CACHE"
id = "8f2a4d355686427585f665688d1cc082"

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "be5a789a003e4f08a94a82dffbb091be"
localConnectionString = "postgres://synkroo:change-me-local-dev-password@localhost:55432/synkroo"

[vars]
NODE_ENV = "production"
OUTBOX_WORKER_URL = "https://synkroo.walissonead.workers.dev"

[env.staging]
name = "synkroo-staging"

[env.staging.vars]
NODE_ENV = "production"
ENVIRONMENT = "staging"
OUTBOX_WORKER_URL = "https://synkroo-staging.walissonead.workers.dev"
[[env.staging.services]]
binding = "IA_BRIDGE"
service = "synkroo-ia-bridge-staging"
entrypoint = "AppService"

[[env.staging.services]]
binding = "WORKER_SELF_REFERENCE"
service = "synkroo-staging"

[[env.staging.durable_objects.bindings]]
name = "AGENT"
class_name = "AgentOrchestrator"
script_name = "synkroo-ia-agent-staging"

[[env.staging.durable_objects.bindings]]
name = "NEXT_CACHE_DO_QUEUE"
class_name = "DOQueueHandler"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["DOQueueHandler"]

[[env.staging.kv_namespaces]]
binding = "SYNKROO_CACHE"
id = "f2ad31b71d484e0ba3fc6df1814d7d8e"

[[env.staging.hyperdrive]]
binding = "HYPERDRIVE"
id = "e0033a75f4e2449084b00b41e22e49a6"
