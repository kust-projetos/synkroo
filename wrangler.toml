name = "synkroo"
main = ".open-next/worker.js"
compatibility_date = "2026-06-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "IA_BRIDGE"
service = "synkroo-ia-bridge"
entrypoint = "AppService"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "synkroo"

[[durable_objects.bindings]]
name = "AGENT"
class_name = "AgentOrchestrator"
script_name = "synkroo-ia-agent"

[[durable_objects.bindings]]
name = "NEXT_CACHE_DO_QUEUE"
class_name = "DOQueueHandler"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DOQueueHandler"]

[[kv_namespaces]]
binding = "SYNKROO_CACHE"
id = "8f2a4d355686427585f665688d1cc082"

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "be5a789a003e4f08a94a82dffbb091be"
localConnectionString = "postgres://synkroo:change-me-local-dev-password@localhost:55432/synkroo"

[[vectorize]]
binding = "VECTORIZE"
index_name = "synkroo-embeddings"

[vars]
NODE_ENV = "production"
